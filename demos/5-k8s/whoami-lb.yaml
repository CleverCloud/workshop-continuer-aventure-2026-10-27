# Trainer demo only: exposes whoami publicly through a CKE LoadBalancer.
# The default quota is ONE LoadBalancer service per organisation: don't let every trainee apply this.
apiVersion: v1
kind: Service
metadata:
  name: whoami-public
spec:
  type: LoadBalancer
  selector:
    app: whoami
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
